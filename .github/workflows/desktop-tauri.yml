name: Desktop (Tauri) — Build and Test

on:
  push:
    branches:
      - 'tauri-desktop-rewrite'
      - 'master'
    # GitHub Actions applies `paths` as a single filter across the whole
    # `push` trigger — it can't be scoped to only one of the branches above.
    # In practice every commit on `tauri-desktop-rewrite` touches these
    # paths anyway (it's the branch this app is developed on), so this is
    # equivalent to "unfiltered" for that branch while giving `master`
    # push-triggered CI only for changes that matter to this app.
    paths:
      - 'apps/desktop-tauri/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - '.github/workflows/desktop-tauri.yml'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'apps/desktop-tauri/**'
      - 'packages/shared/**'
      - 'packages/ui/**'
      - '.github/workflows/desktop-tauri.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript unit tests
        run: pnpm --filter @cs2ann/shared test
      - run: pnpm --filter @cs2ann/desktop-tauri test

      - name: Rust unit tests
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo test

      # `cargo install tauri-driver` compiles from source (~minutes) every
      # run; the resulting binary only changes when tauri-driver publishes a
      # new version, so cache it. Bump the key's `-v<n>` suffix to force a
      # rebuild (e.g. to pick up a new tauri-driver release).
      - name: Cache tauri-driver
        id: cache-tauri-driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver.exe
          # v2: the v1 binary dated from 2026-07 and was being restored on
          # every run, pinning a tauri-driver build older than the current
          # runner image's WebView2. Bumped to force a rebuild.
          key: tauri-driver-windows-v2

      - name: Install tauri-driver
        if: steps.cache-tauri-driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      # Deviation from the original brief: msedgedriver.azureedge.net no
      # longer resolves (see apps/desktop-tauri/e2e/README.md). Download
      # from msedgedriver.microsoft.com instead.
      #
      # The driver must match the **WebView2 Runtime**, not the Edge browser.
      # A Tauri app is a WebView2 host; msedge.exe is a separate product with
      # its own version. They usually track each other, which is why keying
      # off msedge.exe worked until they drifted apart on the runner image
      # (E2E last passed 2026-07-03; it then failed every attempt with
      # "session not created: DevToolsActivePort file doesn't exist"). Both
      # versions are printed below so the logs show the drift directly.
      #
      # The harness (e2e/wdio.conf.ts) prepends e2e/.drivers/ to PATH for the
      # tauri-driver child process only, so the driver is extracted straight
      # into that gitignored directory rather than fighting with the runner's
      # global PATH.
      - name: Install Edge WebDriver
        working-directory: apps/desktop-tauri/e2e
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- Edge browser version (diagnostic only) ---
          $edgePath = "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edgePath)) {
            $edgePath = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          }
          $edgeVersion = if (Test-Path $edgePath) {
            (Get-Item $edgePath).VersionInfo.ProductVersion
          } else { $null }
          Write-Host "Edge browser      : $edgeVersion"

          # --- WebView2 Runtime version (what actually matters) ---
          # Canonical source is the EdgeUpdate client key for the Evergreen
          # Runtime; the install directory is the fallback.
          $wv2Guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $wv2Version = $null
          foreach ($root in @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$wv2Guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$wv2Guid",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$wv2Guid"
          )) {
            try {
              $pv = (Get-ItemProperty -Path $root -Name pv -ErrorAction Stop).pv
              if ($pv) { $wv2Version = $pv; break }
            } catch { }
          }
          if (-not $wv2Version) {
            foreach ($dir in @(
              "C:\Program Files (x86)\Microsoft\EdgeWebView\Application",
              "C:\Program Files\Microsoft\EdgeWebView\Application"
            )) {
              if (Test-Path $dir) {
                $newest = Get-ChildItem $dir -Directory |
                  Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
                  Sort-Object { [version]$_.Name } -Descending |
                  Select-Object -First 1
                if ($newest) { $wv2Version = $newest.Name; break }
              }
            }
          }
          Write-Host "WebView2 Runtime  : $wv2Version"

          if (-not $wv2Version -and -not $edgeVersion) {
            throw "Neither the WebView2 Runtime nor the Edge browser could be located."
          }

          # Prefer WebView2; fall back to Edge so a detection failure degrades
          # to the previous behaviour instead of breaking the job outright.
          $target = if ($wv2Version) { $wv2Version } else { $edgeVersion }
          if ($wv2Version -and $edgeVersion -and $wv2Version -ne $edgeVersion) {
            Write-Host "NOTE: WebView2 and Edge versions differ - matching the driver to WebView2."
          }

          # Exact build first; fall back to the latest driver for that major.
          $urls = @("https://msedgedriver.microsoft.com/$target/edgedriver_win64.zip")
          $major = $target.Split('.')[0]
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Downloading $url"
              Invoke-WebRequest -Uri $url -OutFile edgedriver_win64.zip
              $downloaded = $true
              break
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
            }
          }
          if (-not $downloaded) {
            $latest = (Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/LATEST_RELEASE_${major}_WINDOWS").Content
            $latest = ($latest -replace '[^\d\.]', '').Trim()
            Write-Host "Falling back to latest driver for major ${major}: $latest"
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$latest/edgedriver_win64.zip" -OutFile edgedriver_win64.zip
          }

          New-Item -ItemType Directory -Force -Path .drivers | Out-Null
          Expand-Archive -Path edgedriver_win64.zip -DestinationPath .drivers -Force
          Write-Host "msedgedriver      : $(& .\.drivers\msedgedriver.exe --version)"

      # Deviation from the original brief: wdio.conf.ts's beforeSession
      # hook only runs `cargo build --release --features
      # tauri/custom-protocol` — it does not build the frontend. The Rust
      # build embeds whatever is currently in apps/desktop-tauri/dist/, so
      # that directory must contain a fresh Vite build before `pnpm e2e`
      # runs, or the packaged app has no UI to load.
      - name: Build frontend for E2E
        run: pnpm --filter @cs2ann/desktop-tauri build

      # Deviation from the original brief: a known race on second/later
      # runs on the same runner leaves a stale app/driver process holding
      # the WebView2 user-data directory, which then fails the next E2E
      # run. Best-effort kill any leftovers before starting; a run where
      # nothing is running (fresh runner) is expected to "fail" here and
      # must not fail the job.
      - name: Pre-E2E cleanup
        shell: cmd
        continue-on-error: true
        run: |
          taskkill /IM cs2ann-desktop-tauri.exe /F
          taskkill /IM msedgedriver.exe /F
          taskkill /IM tauri-driver.exe /F

      # Diagnostic (2026-08-09): E2E fails every attempt with
      # "session not created: DevToolsActivePort file doesn't exist", and
      # matching msedgedriver to the WebView2 Runtime did not fix it.
      #
      # This isolates the layers. msedgedriver drives a WebView2 app by
      # launching it with --remote-debugging-port and waiting for the
      # DevTools endpoint. Here we do that part by hand, with no
      # tauri-driver and no msedgedriver involved. If the endpoint answers,
      # the app and WebView2 are fine and the fault is in the driver layer;
      # if it doesn't, the app can't expose a debug port on this runner at
      # all and no driver fix will ever help.
      #
      # Built explicitly here rather than relying on wdio.conf.ts's
      # beforeSession hook so a compile failure is attributable to its own
      # step instead of surfacing inside the E2E log.
      - name: Build release binary for E2E
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo build --release --features tauri/custom-protocol

      - name: Diagnose WebView2 remote debugging
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = "apps/desktop-tauri/src-tauri/target/release/cs2ann-desktop-tauri.exe"
          if (-not (Test-Path $exe)) { throw "app binary not found at $exe" }
          Write-Host "binary: $((Get-Item $exe).Length) bytes"

          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222"
          $env:WEBVIEW2_USER_DATA_FOLDER = "$env:RUNNER_TEMP\wv2-diag"
          $p = Start-Process -FilePath $exe -PassThru

          $ok = $false
          foreach ($i in 1..20) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "app EXITED early, code=$($p.ExitCode)"; break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:9222/json/version" -UseBasicParsing -TimeoutSec 3
              Write-Host "DevTools endpoint responded after $($i*2)s:"
              Write-Host $r.Content
              $ok = $true
              break
            } catch { }
          }
          if (-not $ok -and -not $p.HasExited) {
            Write-Host "app is RUNNING but never exposed a DevTools endpoint on 9222"
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "RESULT: remote-debugging-reachable=$ok"

      - name: E2E smoke suite
        working-directory: apps/desktop-tauri
        run: pnpm e2e

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        working-directory: apps/desktop-tauri
        run: pnpm tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2ann-desktop-tauri-installer
          path: apps/desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
