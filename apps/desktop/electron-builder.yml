appId: com.cs2ann.desktop
productName: CS2 Annotations Manager
copyright: Copyright © 2026
electronVersion: 28.3.3
npmRebuild: false
buildDependenciesFromSource: false

directories:
  output: release-dist
  buildResources: resources

files:
  - out/**/*
  - node_modules/**/*
  - package.json

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch: x64
  # No code signing — self-signed build. SmartScreen shows "Unknown publisher" warning.
  sign: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CS2 Annotations Manager

extraResources:
  - from: resources/icon.png
    to: icon.png

publish:
  provider: github
  owner: DaanMichielsen
  repo: CS2-annotations
